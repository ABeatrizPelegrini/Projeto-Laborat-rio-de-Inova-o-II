<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Controle de Estoque</title>

<link rel="stylesheet" href="style.css">
<script src="script.js"></script>

</head>
<body>

  <div class="login-card">
    <h1>Embalare Distribuidora</h1>
    <p class="subtitle">Selecione o tipo de acesso</p>

    <!-- Abas para escolher o tipo de login -->
    <div class="login-type-tabs">
      <button type="button" class="tab-btn active" data-tipo="administrativo">Administrativo</button>
      <button type="button" class="tab-btn" data-tipo="operacional">Operacional</button>
      <button type="button" class="tab-btn" data-tipo="comercial">Comercial</button>
    </div>

    <form id="loginForm">

      <!-- Campos do login Administrativo (e-mail + senha) -->
      <div class="login-fields" data-fields="administrativo">
        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="seu@email.com" required>
        </div>
      </div>

      <!-- Campos do login Operacional (matrícula + senha) -->
      <div class="login-fields" data-fields="operacional" hidden>
        <div class="field">
          <label for="matricula">Matrícula</label>
          <input type="text" id="matricula" name="matricula" placeholder="Ex: 000123" inputmode="numeric">
        </div>
      </div>

      <!-- Campos do login Comercial (CNPJ + senha) -->
      <div class="login-fields" data-fields="comercial" hidden>
        <div class="field">
          <label for="cnpj">CNPJ</label>
          <input type="text" id="cnpj" name="cnpj" placeholder="00.000.000/0000-00" inputmode="numeric" maxlength="18">
        </div>
      </div>

      <!-- Campo de senha, comum aos três tipos -->
      <div class="field">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="••••••••" required>
      </div>

      <div class="options">
        <label><input type="checkbox" name="lembrar"> Lembrar-me</label>
        <a href="#">Esqueceu a senha?</a>
      </div>

      <button type="submit" class="btn-login">Entrar</button>
    </form>
  </div>

  <script>
    // Guarda qual tipo de login está ativo no momento
    let tipoAtivo = 'administrativo';

    const tabs = document.querySelectorAll('.tab-btn');
    const grupos = document.querySelectorAll('.login-fields');

    // Configuração de cada tipo: id do input principal e se ele é obrigatório
    const config = {
      administrativo: { inputId: 'email' },
      operacional: { inputId: 'matricula' },
      comercial: { inputId: 'cnpj' }
    };

    tabs.forEach(function (tab) {
      tab.addEventListener('click', function () {
        const tipo = tab.dataset.tipo;
        tipoAtivo = tipo;

        // Atualiza visual: só a aba clicada fica "active"
        tabs.forEach(function (t) { t.classList.remove('active'); });
        tab.classList.add('active');

        // Mostra o grupo de campos correspondente e esconde os outros
        grupos.forEach(function (grupo) {
          const ehDoTipoAtivo = grupo.dataset.fields === tipo;
          grupo.hidden = !ehDoTipoAtivo;

          // Ajusta o "required": só o input visível deve ser obrigatório
          const input = grupo.querySelector('input');
          input.required = ehDoTipoAtivo;
        });
      });
    });

    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();

      const identificadorInput = document.getElementById(config[tipoAtivo].inputId);
      const senha = document.getElementById('senha').value;

      const dados = {
        tipo: tipoAtivo,
        identificador: identificadorInput.value,
        senha: senha
      };

      console.log('Login enviado:', dados);
      alert('Login "' + tipoAtivo + '" enviado! (exemplo, sem backend)');
    });

    // Máscara simples de CNPJ enquanto o usuário digita
    document.getElementById('cnpj').addEventListener('input', function (e) {
      let v = e.target.value.replace(/\D/g, '').slice(0, 14);
      v = v.replace(/(\d{2})(\d)/, '$1.$2');
      v = v.replace(/(\d{3})(\d)/, '$1.$2');
      v = v.replace(/(\d{3})(\d)/, '$1/$2');
      v = v.replace(/(\d{4})(\d)/, '$1-$2');
      e.target.value = v;
    });
  </script>

</body>
</html>
