<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Primeiro Cadastro</title>

</head>

<body>

    <div class="cadastro-card">

        <h1>Primeiro Cadastro</h1>

        <p>
            Cadastre o administrador do sistema
        </p>

        <form id="formCadastro">

            <label for="nome">
                Nome
            </label>

            <input
                type="text"
                id="nome"
                placeholder="Digite o nome"
                required
            >

            <label for="email">
                E-mail
            </label>

            <input
                type="email"
                id="email"
                placeholder="Digite o e-mail"
                required
            >

            <label for="senha">
                Senha
            </label>

            <input
                type="password"
                id="senha"
                placeholder="Digite a senha"
                required
            >

            <label for="confirmarSenha">
                Confirmar senha
            </label>

            <input
                type="password"
                id="confirmarSenha"
                placeholder="Confirme a senha"
                required
            >

            <button type="submit">
                Criar administrador
            </button>

        </form>

    </div>

    <script src="js/cadastro.js"></script>

</body>

</html>
